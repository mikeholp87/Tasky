[package]
name = "tm-core"
version = "0.1.0"
description = "Monitoring engine and platform layer for Task Manager (no UI dependencies)"
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["disk", "network", "system", "user"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
ts-rs = "12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Wdk_System_SystemInformation",
] }

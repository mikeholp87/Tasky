[package]
name = "taskmanager"
version = "0.1.4"
description = "Cross-platform task manager and system monitor"
authors = ["Task Manager contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[workspace]
members = ["core"]

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "taskmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tm-core = { version = "0.1.4", path = "core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tracing-appender = "0.2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already part of Tauri's GTK stack: desktop bus queries and backend selection.
gio = "0.18"
gdk = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Linux writes its own XDG login entry instead (src/autostart.rs).
tauri-plugin-autostart = "2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Benchmarks rely on catch_unwind to turn a panic (e.g. in a GPU driver) into
# a "Failed" result and release their locks; "abort" would kill the app.
panic = "unwind"
strip = true

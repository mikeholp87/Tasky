[package]
name = "taskmanager"
version = "0.1.0"
description = "Cross-platform task manager and system monitor"
authors = ["Task Manager contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "taskmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

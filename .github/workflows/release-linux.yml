name: Linux Debian release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check release version
        env:
          TAG: ${{ github.ref_name }}
        run: test "${TAG#v}" = "$(jq -r .version src-tauri/tauri.conf.json)"
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev desktop-file-utils
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.96.0
      - run: npm ci
      - run: npx tauri build --bundles deb --config src-tauri/tauri.linux.conf.json
      - name: Validate package and checksum
        run: |
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)
          test "${#packages[@]}" -eq 1
          deb=${packages[0]}
          scripts/validate-deb.sh "$deb"
          cp "$deb" Tasky.deb
          sha256sum Tasky.deb > Tasky.deb.sha256
      - name: Install and remove package in clean Ubuntu 22.04
        run: |
          docker run --rm -v "$PWD/Tasky.deb:/tmp/Tasky.deb:ro" ubuntu:22.04 bash -euxo pipefail -c '
            apt-get update
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y /tmp/Tasky.deb desktop-file-utils
            dpkg-query -s tasky | grep -q "^Status: install ok installed$"
            desktop-file-validate /usr/share/applications/Tasky.desktop
            apt-get remove -y tasky
          '
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          files: |
            Tasky.deb
            Tasky.deb.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-release
          path: Tasky.deb

  apt:
    needs: build
    runs-on: ubuntu-22.04
    environment: apt-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deb-release
      - name: Install aptly and signing key
        env:
          APTLY_GPG_KEY: ${{ secrets.APTLY_GPG_KEY }}
          APTLY_GPG_PASSPHRASE: ${{ secrets.APTLY_GPG_PASSPHRASE }}
          APTLY_KEY_ID: ${{ vars.APTLY_KEY_ID || secrets.APTLY_KEY_ID }}
        run: |
          test -n "$APTLY_GPG_KEY" && test -n "$APTLY_KEY_ID"
          sudo apt-get update && sudo apt-get install -y aptly gnupg
          printf '%s' "$APTLY_GPG_KEY" | gpg --batch --import
          actual_fingerprint=$(gpg --batch --with-colons --list-secret-keys "$APTLY_KEY_ID" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$actual_fingerprint" = "$APTLY_KEY_ID"
          printf '%s' "$APTLY_GPG_PASSPHRASE" > "$RUNNER_TEMP/aptly-passphrase"
          chmod 600 "$RUNNER_TEMP/aptly-passphrase"
      - name: Build signed repository
        env:
          APTLY_KEY_ID: ${{ vars.APTLY_KEY_ID || secrets.APTLY_KEY_ID }}
          APTLY_PASSPHRASE_FILE: ${{ runner.temp }}/aptly-passphrase
        run: |
          scripts/publish-apt.sh Tasky.deb "$GITHUB_REF_NAME" public
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: apt
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

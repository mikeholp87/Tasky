name: Security

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: 1.96.0
      - name: Audit npm lockfile without running package scripts
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Install pinned local auditors
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
      - name: RustSec (including visible maintenance and unsoundness warnings)
        working-directory: src-tauri
        run: cargo audit
      - name: Dependency policy
        working-directory: src-tauri
        run: cargo deny check advisories bans licenses sources

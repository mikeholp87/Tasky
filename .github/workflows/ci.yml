name: CI

on:
  # Not on every push: run when a PR is opened or marked ready, or by hand
  # (Actions tab or `gh workflow run`).
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          components: clippy, rustfmt
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace --locked

      - name: Generated TypeScript types are up to date
        shell: bash
        run: |
          git status --porcelain -- src/types/generated
          test -z "$(git status --porcelain -- src/types/generated)"

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # Pull requests validate Debian packaging only; a manual run builds every bundle.
        # `matrix` is not available in a job-level `if:`, so the OS list is chosen here.
        # Linux bundles are built on the oldest supported base so the
        # binary's glibc requirement (2.35) is met by Debian 12, Ubuntu 22.04
        # and newer. Building on a newer distro would raise that floor.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-22.04"]') || fromJSON('["windows-latest", "ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --config src-tauri/tauri.linux.conf.json -- --locked
        if: runner.os == 'Linux'
      - run: npx tauri build -- --locked
        if: runner.os == 'Windows'
      - name: Validate Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print)
          test "${#packages[@]}" -eq 1
          deb=${packages[0]}
          scripts/validate-deb.sh "$deb"
          docker run --rm -v "$PWD/$deb:/tmp/Tasky.deb:ro" ubuntu:22.04 bash -euxo pipefail -c '
            apt-get update
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y /tmp/Tasky.deb desktop-file-utils
            dpkg-query -s tasky | grep -q "^Status: install ok installed$"
            desktop-file-validate /usr/share/applications/Tasky.desktop
            apt-get remove -y tasky
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

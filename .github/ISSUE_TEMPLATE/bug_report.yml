name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.1.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and desktop
      placeholder: e.g. Debian testing, KDE Plasma, Wayland
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any private information (paths, hostnames, passwords) first.
